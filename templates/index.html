<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Digital Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>My Digital Library</h1>
        <nav>
            <a href="#">Library</a>
            <a href="#">Blog</a>
            <a href="#">About</a>
        </nav>
    </header>
    
    <main>
        <div id="controls">
            <button id="tile-view">Tile</button>
            <button id="kanban-view">Kanban</button>
            <button id="add-btn" onclick="openModal()">+ Add</button>
            <select id="category-filter" onchange="filterItems(this.value)">
            <option value="all">All Categories</option>
            <option value="Development Economics">Development Economics</option>
            <option value="Demography">Demography</option>
            <option value="Political Economy">Political Economy</option>
            <option value="Economic History">Economic History</option>
            <option value="Philosophy">Philosophy</option>
            <option value="Statistics & Methods">Statistics & Methods</option>
            <option value="Sociology">Sociology</option>
            <option value="Essays & Culture">Essays & Culture</option>
            <option value="Psychology">Psychology</option>
            <option value="Econometrics">Econometrics</option>
            <option value="Experimental Economics">Experimental Economics</option>
            <option value="Topological Data Analysis">Topological Data Analysis</option>
            <option value="Film & Photography">Film & Photography</option>
            <option value="Macroeconomics">Macroeconomics</option>
            <option value="Applied Economics">Applied Economics</option>
            <option value="Urban & Spatial Economics">Urban & Spatial Economics</option>
            <option value="Personal Blog">Personal Blog</option>
            </select>
        </div>
    
        <div id="library-container">
            <!-- cards will go here -->
        </div>
    </main>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    <div id="modal" class="modal hidden">
    <div class="modal-box">
        <h2>Add to Library</h2>
        <input type="text" id="title" placeholder="Title" />
        <input type="text" id="author" placeholder="Author" />
        <input type="text" id="link" placeholder="Link (optional)" />
        <input type="text" id="doi-or-link" placeholder="DOI (optional — auto-fills title & author)" onblur="smartFetch(this.value)" />
        <select id="type">
            <option value="Paper">Paper</option>
            <option value="Book">Book</option>
            <option value="Essay">Essay</option>
            <option value="Blog">Blog</option>
        </select>
        <div class="category-dropdown">
            <div class="category-toggle" id="category-toggle" tabindex="0">Select Categories ▾</div>
            <div class="category-options hidden" id="category-options">
                <label><input type="checkbox" onchange="updateCategoryToggle()" value="Development Economics" > Development Economics</label>
                <label><input type="checkbox" onchange="updateCategoryToggle()" value="Demography"> Demography</label>
                <label><input type="checkbox" onchange="updateCategoryToggle()" value="Political Economy"> Political Economy</label>
                <label><input type="checkbox" onchange="updateCategoryToggle()" value="Economic History"> Economic History</label>
                <label><input type="checkbox" onchange="updateCategoryToggle()" value="Philosophy"> Philosophy</label>
                <label><input type="checkbox" onchange="updateCategoryToggle()" value="Statistics & Methods"> Statistics & Methods</label>
                <label><input type="checkbox" onchange="updateCategoryToggle()" value="Sociology"> Sociology</label>
                <label><input type="checkbox" onchange="updateCategoryToggle()" value="Essays & Culture"> Essays & Culture</label>
                <label><input type="checkbox" onchange="updateCategoryToggle()" value="Psychology"> Psychology</label>
                <label><input type="checkbox" onchange="updateCategoryToggle()" value="Econometrics"> Econometrics</label>
                <label><input type="checkbox" onchange="updateCategoryToggle()" value="Experimental Economics"> Experimental Economics</label>
                <label><input type="checkbox" onchange="updateCategoryToggle()" value="Topological Data Analysis"> Topological Data Analysis</label>
                <label><input type="checkbox" onchange="updateCategoryToggle()" value="Film & Photography"> Film & Photography</label>
                <label><input type="checkbox" onchange="updateCategoryToggle()" value="Macroeconomics"> Macroeconomics</label>
                <label><input type="checkbox" onchange="updateCategoryToggle()" value="Applied Economics"> Applied Economics</label>
                <label><input type="checkbox" onchange="updateCategoryToggle()" value="Urban & Spatial Economics"> Urban & Spatial Economics</label>
                <label><input type="checkbox" onchange="updateCategoryToggle()" value="Personal Blog"> Personal Blog</label>
            </div>
        </div>
        <input type="text" id="tags" placeholder="Tags (e.g. #growth #price)" />
        <div class="modal-buttons">
            <button onclick="closeModal()">Cancel</button>
            <button class="btn-submit" onclick="submitItem()">Add & Summarise</button>
        </div>
    </div>
</div>
</body>
</html>

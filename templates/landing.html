<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Some Notes!</title>
    <link rel="icon" href="https://i.pinimg.com/736x/d5/2f/53/d52f536b526c344ecf86d8f482feb52c.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* BACKGROUND IMAGE */
        .bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* Soft overlay to make text readable in sky area */
        .bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(255,248,245,0.35) 0%,
                rgba(255,245,250,0.15) 40%,
                transparent 65%
            );
        }

        /* HERO */
        .hero {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: clamp(3rem, 8vh, 6rem);
            text-align: center;
            pointer-events: none;
        }

        .hero-eyebrow {
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #7a6060;
            margin-bottom: 0.75rem;
            font-weight: 500;
        }

        .hero-title {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(4rem, 11vw, 8rem);
            color: #2a1e1e;
            line-height: 1;
            margin-bottom: 1rem;
            text-shadow: 0 2px 20px rgba(255,240,240,0.8);
        }

        .hero-title em {
            font-style: italic;
            color: #b07090;
        }

        .hero-subtitle {
            font-size: 1rem;
            color: #5a4a4a;
            max-width: 380px;
            line-height: 1.7;
            margin-bottom: 2rem;
            font-weight: 300;
            text-shadow: 0 1px 8px rgba(255,245,245,0.9);
        }

        .hero-btn {
            display: inline-block;
            padding: 0.85rem 2.5rem;
            background: rgba(192, 132, 176, 0.85);
            backdrop-filter: blur(8px);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.88rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            transition: all 0.3s;
            box-shadow: 0 4px 24px rgba(176, 112, 144, 0.35);
            pointer-events: all;
            border: 1px solid rgba(255,255,255,0.3);
            position: fixed;
            top: 1.5rem;
            right: 2rem;
            z-index: 20;
        }
        
        .hero-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(176, 112, 144, 0.45);
            background: rgba(176, 100, 155, 0.9);
        }

        /* SVG FLOWER OVERLAY */
        .flower-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            z-index: 5;
            pointer-events: none;
        }

        /* SWAY ANIMATIONS */
        @keyframes sway-a {
            0%, 100% { transform: rotate(-3deg); }
            50%       { transform: rotate(3deg); }
        }
        @keyframes sway-b {
            0%, 100% { transform: rotate(4deg); }
            50%       { transform: rotate(-4deg); }
        }
        @keyframes sway-c {
            0%, 100% { transform: rotate(-5deg); }
            50%       { transform: rotate(2deg); }
        }
        @keyframes sway-d {
            0%, 100% { transform: rotate(2deg); }
            50%       { transform: rotate(-6deg); }
        }

        .f-a { animation: sway-a 3s ease-in-out infinite; transform-origin: bottom center; }
        .f-b { animation: sway-b 2.6s ease-in-out infinite 0.4s; transform-origin: bottom center; }
        .f-c { animation: sway-c 3.4s ease-in-out infinite 0.8s; transform-origin: bottom center; }
        .f-d { animation: sway-d 2.9s ease-in-out infinite 1.2s; transform-origin: bottom center; }

        /* FOOTER */
        .landing-footer {
            position: fixed;
            bottom: 1rem;
            width: 100%;
            text-align: center;
            z-index: 20;
            color: white;
            font-size: 0.75rem;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }

        .landing-footer img {
            vertical-align: middle;
            opacity: 0.8;
            filter: brightness(0);
        }
    </style>
</head>
<body>


<video class="bg" autoplay muted loop playsinline>
    <source src="/static/meadow.mp4" type="video/mp4">
</video>

<div class="hero">
    <p class="hero-eyebrow">A personal reading library</p>
    <h1 class="hero-title">Some <em>Notes!</em></h1>
    <p class="hero-subtitle">Papers, books, essays and blogs — curated with care.</p>
    <a href="/library" class="hero-btn">Open the Library →</a>
</div>

<!-- SVG animated flowers overlaid on the image flowers -->
<svg class="flower-overlay" viewBox="0 0 1440 400" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">

    <!-- Flower helper: daisy shape -->
    <defs>
        <g id="daisy-white">
            <circle cx="0" cy="0" r="5" fill="#f5c542"/>
            <ellipse cx="0" cy="-11" rx="4" ry="7" fill="white" opacity="0.9"/>
            <ellipse cx="0" cy="-11" rx="4" ry="7" fill="white" opacity="0.9" transform="rotate(45)"/>
            <ellipse cx="0" cy="-11" rx="4" ry="7" fill="white" opacity="0.9" transform="rotate(90)"/>
            <ellipse cx="0" cy="-11" rx="4" ry="7" fill="white" opacity="0.9" transform="rotate(135)"/>
            <ellipse cx="0" cy="-11" rx="4" ry="7" fill="white" opacity="0.9" transform="rotate(180)"/>
            <ellipse cx="0" cy="-11" rx="4" ry="7" fill="white" opacity="0.9" transform="rotate(225)"/>
            <ellipse cx="0" cy="-11" rx="4" ry="7" fill="white" opacity="0.9" transform="rotate(270)"/>
            <ellipse cx="0" cy="-11" rx="4" ry="7" fill="white" opacity="0.9" transform="rotate(315)"/>
        </g>
        <g id="daisy-pink">
            <circle cx="0" cy="0" r="4" fill="#f5c542"/>
            <ellipse cx="0" cy="-10" rx="3.5" ry="6.5" fill="#f0b8d0" opacity="0.9"/>
            <ellipse cx="0" cy="-10" rx="3.5" ry="6.5" fill="#f0b8d0" opacity="0.9" transform="rotate(45)"/>
            <ellipse cx="0" cy="-10" rx="3.5" ry="6.5" fill="#f0b8d0" opacity="0.9" transform="rotate(90)"/>
            <ellipse cx="0" cy="-10" rx="3.5" ry="6.5" fill="#f0b8d0" opacity="0.9" transform="rotate(135)"/>
            <ellipse cx="0" cy="-10" rx="3.5" ry="6.5" fill="#f0b8d0" opacity="0.9" transform="rotate(180)"/>
            <ellipse cx="0" cy="-10" rx="3.5" ry="6.5" fill="#f0b8d0" opacity="0.9" transform="rotate(225)"/>
            <ellipse cx="0" cy="-10" rx="3.5" ry="6.5" fill="#f0b8d0" opacity="0.9" transform="rotate(270)"/>
            <ellipse cx="0" cy="-10" rx="3.5" ry="6.5" fill="#f0b8d0" opacity="0.9" transform="rotate(315)"/>
        </g>
    </defs>

    <!-- Left cluster -->
    <g class="f-a"><line x1="80" y1="400" x2="85" y2="260" stroke="#7aaa5a" stroke-width="1.5"/><use href="#daisy-white" transform="translate(85,260) scale(1.3)"/></g>
    <g class="f-c"><line x1="120" y1="400" x2="115" y2="290" stroke="#7aaa5a" stroke-width="1.5"/><use href="#daisy-pink" transform="translate(115,290) scale(1.1)"/></g>
    <g class="f-b"><line x1="55" y1="400" x2="60" y2="310" stroke="#8aaa6a" stroke-width="1.2"/><use href="#daisy-white" transform="translate(60,310) scale(0.9)"/></g>
    <g class="f-d"><line x1="160" y1="400" x2="155" y2="270" stroke="#7aaa5a" stroke-width="1.5"/><use href="#daisy-pink" transform="translate(155,270) scale(1.2)"/></g>

    <!-- Left-center -->
    <g class="f-b"><line x1="260" y1="400" x2="265" y2="240" stroke="#7aaa5a" stroke-width="1.5"/><use href="#daisy-white" transform="translate(265,240) scale(1.4)"/></g>
    <g class="f-a"><line x1="310" y1="400" x2="305" y2="280" stroke="#8aaa6a" stroke-width="1.3"/><use href="#daisy-pink" transform="translate(305,280) scale(1.0)"/></g>
    <g class="f-c"><line x1="220" y1="400" x2="225" y2="300" stroke="#7aaa5a" stroke-width="1.2"/><use href="#daisy-white" transform="translate(225,300) scale(0.95)"/></g>

    <!-- Center -->
    <g class="f-d"><line x1="500" y1="400" x2="505" y2="230" stroke="#7aaa5a" stroke-width="1.5"/><use href="#daisy-white" transform="translate(505,230) scale(1.5)"/></g>
    <g class="f-a"><line x1="560" y1="400" x2="555" y2="270" stroke="#8aaa6a" stroke-width="1.3"/><use href="#daisy-pink" transform="translate(555,270) scale(1.1)"/></g>
    <g class="f-b"><line x1="620" y1="400" x2="625" y2="255" stroke="#7aaa5a" stroke-width="1.5"/><use href="#daisy-white" transform="translate(625,255) scale(1.2)"/></g>
    <g class="f-c"><line x1="450" y1="400" x2="448" y2="295" stroke="#8aaa6a" stroke-width="1.2"/><use href="#daisy-pink" transform="translate(448,295) scale(0.9)"/></g>

    <!-- Right-center -->
    <g class="f-c"><line x1="820" y1="400" x2="825" y2="245" stroke="#7aaa5a" stroke-width="1.5"/><use href="#daisy-pink" transform="translate(825,245) scale(1.3)"/></g>
    <g class="f-a"><line x1="880" y1="400" x2="875" y2="275" stroke="#8aaa6a" stroke-width="1.3"/><use href="#daisy-white" transform="translate(875,275) scale(1.1)"/></g>
    <g class="f-d"><line x1="760" y1="400" x2="758" y2="300" stroke="#7aaa5a" stroke-width="1.2"/><use href="#daisy-white" transform="translate(758,300) scale(0.9)"/></g>
    <g class="f-b"><line x1="940" y1="400" x2="945" y2="260" stroke="#7aaa5a" stroke-width="1.5"/><use href="#daisy-pink" transform="translate(945,260) scale(1.2)"/></g>

    <!-- Right cluster -->
    <g class="f-a"><line x1="1100" y1="400" x2="1105" y2="255" stroke="#7aaa5a" stroke-width="1.5"/><use href="#daisy-white" transform="translate(1105,255) scale(1.3)"/></g>
    <g class="f-c"><line x1="1160" y1="400" x2="1155" y2="285" stroke="#8aaa6a" stroke-width="1.3"/><use href="#daisy-pink" transform="translate(1155,285) scale(1.1)"/></g>
    <g class="f-d"><line x1="1050" y1="400" x2="1048" y2="305" stroke="#7aaa5a" stroke-width="1.2"/><use href="#daisy-white" transform="translate(1048,305) scale(0.9)"/></g>
    <g class="f-b"><line x1="1250" y1="400" x2="1255" y2="265" stroke="#7aaa5a" stroke-width="1.5"/><use href="#daisy-pink" transform="translate(1255,265) scale(1.2)"/></g>
    <g class="f-a"><line x1="1340" y1="400" x2="1338" y2="280" stroke="#8aaa6a" stroke-width="1.3"/><use href="#daisy-white" transform="translate(1338,280) scale(1.0)"/></g>
    <g class="f-c"><line x1="1390" y1="400" x2="1392" y2="310" stroke="#7aaa5a" stroke-width="1.2"/><use href="#daisy-pink" transform="translate(1392,310) scale(0.85)"/></g>

</svg>

<div class="landing-footer">
    made with ❤️ by Mithilesh &nbsp;·&nbsp; vibe coded with
    <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Anthropic_logo.svg" height="11"/>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Some Notes!</title>
    <link rel="icon" href="https://i.pinimg.com/736x/d5/2f/53/d52f536b526c344ecf86d8f482feb52c.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .bg {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg,
                #f5eef8 0%,
                #fdf5ff 30%,
                #f0f8ee 65%,
                #d8ecb0 85%,
                #c8e098 100%
            );
            z-index: 0;
        }

        .clouds {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 40%;
            z-index: 1;
            pointer-events: none;
        }

        .cloud {
            position: absolute;
            border-radius: 50px;
            background: rgba(255,255,255,0.65);
            filter: blur(7px);
        }

        .c1 { width: 190px; height: 46px; top: 7%; left: 4%; animation: drift 20s ease-in-out infinite; }
        .c2 { width: 280px; height: 56px; top: 14%; left: 28%; animation: drift 26s ease-in-out infinite 2s; }
        .c3 { width: 140px; height: 38px; top: 5%; right: 9%; animation: drift 17s ease-in-out infinite 1s; }
        .c4 { width: 220px; height: 48px; top: 20%; right: 22%; animation: drift 22s ease-in-out infinite 4s; }

        @keyframes drift {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(28px); }
        }

        .hill-back {
            position: fixed;
            bottom: 100px;
            left: -5%; width: 110%; height: 220px;
            background: linear-gradient(180deg, #b0d888 0%, #88b858 100%);
            border-radius: 50% 50% 0 0;
            opacity: 0.55;
            z-index: 2;
        }

        .hill-mid {
            position: fixed;
            bottom: 40px;
            left: -5%; width: 110%; height: 200px;
            background: linear-gradient(180deg, #c0e090 0%, #98c868 100%);
            border-radius: 52% 48% 0 0;
            z-index: 3;
        }

        .hill-front {
            position: fixed;
            bottom: 0;
            left: -5%; width: 110%; height: 130px;
            background: linear-gradient(180deg, #d0eaa8 0%, #b0d878 100%);
            border-radius: 40% 44% 0 0;
            z-index: 4;
        }

        .hero {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: clamp(3rem, 8vh, 5rem);
            text-align: center;
            pointer-events: none;
        }

        .hero-eyebrow {
            font-size: 0.72rem;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: #907878;
            margin-bottom: 0.7rem;
            font-weight: 500;
        }

        .hero-title {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(4rem, 11vw, 8rem);
            color: #2a1e1e;
            line-height: 1;
            margin-bottom: 1rem;
            text-shadow: 0 2px 20px rgba(255,240,248,0.9);
        }

        .hero-title em {
            font-style: italic;
            color: #b07090;
        }

        .hero-subtitle {
            font-size: 1rem;
            color: #5a4a4a;
            max-width: 380px;
            line-height: 1.7;
            margin-bottom: 2rem;
            font-weight: 300;
            text-shadow: 0 1px 8px rgba(255,248,252,0.9);
        }

        .hero-btn {
            display: inline-block;
            padding: 0.85rem 2.5rem;
            background: rgba(192, 132, 176, 0.82);
            backdrop-filter: blur(8px);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.88rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            transition: all 0.3s;
            box-shadow: 0 4px 24px rgba(176, 112, 144, 0.32);
            pointer-events: all;
            border: 1px solid rgba(255,255,255,0.3);
            position: fixed;
            top: 1.5rem;
            right: 2rem;
            z-index: 20;
        }

        .hero-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(176, 112, 144, 0.45);
            background: rgba(176, 100, 155, 0.9);
        }

        .flower-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55%;
            z-index: 8;
            pointer-events: none;
        }

        @keyframes sway-a {
            0%, 100% { transform: rotate(-3deg); }
            50%       { transform: rotate(3deg); }
        }
        @keyframes sway-b {
            0%, 100% { transform: rotate(4deg); }
            50%       { transform: rotate(-4deg); }
        }
        @keyframes sway-c {
            0%, 100% { transform: rotate(-5deg); }
            50%       { transform: rotate(2deg); }
        }
        @keyframes sway-d {
            0%, 100% { transform: rotate(2deg); }
            50%       { transform: rotate(-6deg); }
        }

        .f-a { animation: sway-a 3s ease-in-out infinite; transform-origin: bottom center; }
        .f-b { animation: sway-b 2.6s ease-in-out infinite 0.4s; transform-origin: bottom center; }
        .f-c { animation: sway-c 3.4s ease-in-out infinite 0.8s; transform-origin: bottom center; }
        .f-d { animation: sway-d 2.9s ease-in-out infinite 1.2s; transform-origin: bottom center; }

        .landing-footer {
            position: fixed;
            bottom: 1rem;
            width: 100%;
            text-align: center;
            z-index: 20;
            color: #6a5858;
            font-size: 0.75rem;
            text-shadow: 0 1px 4px rgba(255,245,245,0.8);
        }

        .landing-footer img {
            vertical-align: middle;
            opacity: 0.8;
            filter: brightness(0);
        }
    </style>
</head>
<body>

<div class="bg"></div>

<div class="clouds">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4"></div>
</div>

<div class="hill-back"></div>
<div class="hill-mid"></div>
<div class="hill-front"></div>

<div class="hero">
    <p class="hero-eyebrow">A personal reading library</p>
    <h1 class="hero-title">Some <em>Notes!</em></h1>
    <p class="hero-subtitle">Papers, books, essays and blogs — curated with care.</p>
</div>

<a href="/library" class="hero-btn">Open the Library →</a>
